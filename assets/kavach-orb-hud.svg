<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d">
<title id="t">KAVACH Continuity-Bound Authority HUD</title>
<desc id="d">Animated KAVACH orb showing trust, authority, continuity, protected execution and evidence.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#061528"/>
    <stop offset=".55" stop-color="#0a2b51"/>
    <stop offset="1" stop-color="#07101d"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop stop-color="#48c8ff" stop-opacity=".72"/>
    <stop offset=".42" stop-color="#0f72df" stop-opacity=".25"/>
    <stop offset="1" stop-color="#0f72df" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff" stop-opacity=".16"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".035"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1280" height="520" rx="30" fill="url(#bg)"/>
<circle cx="970" cy="235" r="225" fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="r" values="205;235;205" dur="5s" repeatCount="indefinite"/>
</circle>
<rect x="58" y="52" width="1164" height="416" rx="28" fill="url(#glass)" stroke="#8fd9ff" stroke-opacity=".23"/>
<g font-family="Segoe UI,Inter,Arial,sans-serif">
  <text x="105" y="124" font-size="19" letter-spacing="4" fill="#75cfff">XMECK-LAB / TRANSCRIPT</text>
  <text x="105" y="202" font-size="67" font-weight="750" fill="#fff">KAVACH</text>
  <text x="108" y="250" font-size="25" fill="#d8efff">Continuity-Bound Authority &amp; Protection Substrate</text>
  <text x="108" y="307" font-size="21" font-weight="700" fill="#ff9a2b">AUTHORITY BEFORE PROTECTED ACTION.</text>
  <text x="108" y="354" font-size="18" fill="#b7d9f1">TRUST → AUTHORITY → CONTINUITY → EXECUTION → EVIDENCE</text>
  <g transform="translate(950 245)">
    <circle r="111" fill="#061528" stroke="#7bd6ff" stroke-width="2"/>
    <circle r="89" fill="none" stroke="#19baf4" stroke-width="3" stroke-dasharray="165 55">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="67" fill="none" stroke="#1e78e6" stroke-width="3" stroke-dasharray="105 40">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="46" fill="none" stroke="#ff8b22" stroke-width="4" stroke-dasharray="72 28">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="#fff">
      <animate attributeName="opacity" values=".72;1;.72" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text y="7" text-anchor="middle" font-size="27" font-weight="800" fill="#0d66c9">K</text>
  </g>
  <g font-size="14" font-weight="700">
    <rect x="105" y="392" width="154" height="38" rx="19" fill="#0e6ccc"/><text x="182" y="416" text-anchor="middle" fill="#fff">KAVACH 2.0</text>
    <rect x="272" y="392" width="206" height="38" rx="19" fill="#0d2139" stroke="#3f8bc5"/><text x="375" y="416" text-anchor="middle" fill="#bfe6ff">SOFTWARE REFERENCE</text>
    <rect x="491" y="392" width="140" height="38" rx="19" fill="#0d2139" stroke="#32b986"/><text x="561" y="416" text-anchor="middle" fill="#73e2b2">CI VERIFIED</text>
  </g>
</g>
</svg>
